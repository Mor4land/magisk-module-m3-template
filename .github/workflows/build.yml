name: Build Magisk Module & Companion App

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Companion App & Magisk ZIP
        run: python3 build.py

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MagiskTemplate-M3-Build
          path: |
            dist/*.apk
            dist/*.zip
          retention-days: 14
